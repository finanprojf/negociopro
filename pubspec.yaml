name: negociopro2
description: NegocioPro — Gestión inteligente para tu negocio. Por FinanPro Solutions.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.5.0

  # Base de datos local (offline)
  sqflite: ^2.3.2
  path: ^1.9.0

  # Formateo
  intl: ^0.19.0

  # Imágenes
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1

  # PDF y compartir
  pdf: ^3.11.1
  printing: ^5.13.1
  share_plus: ^9.0.0

  # Permisos
  permission_handler: ^11.3.1

  # Storage local
  shared_preferences: ^2.2.3

  # Conectividad
  connectivity_plus: ^6.0.3

  # UUID
  uuid: ^4.4.0

  # URL launcher (WhatsApp)
  url_launcher: ^6.3.0

  # Fuente Poppins via Google Fonts (sin archivos locales)
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true